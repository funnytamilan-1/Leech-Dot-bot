# Leech Dot Bot checks · @Code_Dots · partner @CodeRips
name: Python source checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run configuration regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source across repository
        run: python -m compileall -q .
