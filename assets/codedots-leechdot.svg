<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CodeDots — Leech Dot Bot</title>
  <desc id="desc">A neon cyan and violet code-inspired logo for Leech Dot Bot by Code_Dots and CodeRips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b18"/><stop offset="1" stop-color="#17102b"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#42e8ff"/><stop offset="1" stop-color="#9b6cff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#bg)"/>
  <circle cx="150" cy="180" r="92" fill="#42e8ff" opacity=".16" filter="url(#shadow)"/>
  <rect x="66" y="96" width="168" height="168" rx="42" fill="#111a31" stroke="url(#glow)" stroke-width="4"/>
  <path d="M126 143 92 180l34 37M174 143l34 37-34 37" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
