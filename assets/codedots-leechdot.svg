  <text x="278" y="166" fill="#f4f7ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="1">LEECH <tspan fill="url(#glow)">DOT</tspan></text>
  <text x="282" y="218" fill="#a8b4d8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" letter-spacing="7">TELEGRAM AUTOMATION</text>
  <path d="M282 247H1050" stroke="url(#glow)" stroke-width="2" opacity=".8"/>
  <text x="282" y="290" fill="#e3e9ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">MADE BY @Code_Dots  ·  PARTNER @CodeRips</text>
</svg>